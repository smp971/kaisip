<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KaiSIP unit tests</title>
<style>
  body { font: 14px monospace; background: #111; color: #ddd; padding: 8px; }
  .ok { color: #6c6; } .bad { color: #f66; font-weight: bold; }
</style>
</head>
<body>
<h3>KaiSIP unit tests</h3>
<div id="results"></div>
<div id="summary"></div>
<script src="../app/js/util.js"></script>
<script src="../app/js/config.js"></script>
<script src="../app/js/errors.js"></script>
<script src="../app/js/calllog.js"></script>
<script>
/* minimal stubs so call.js / route.js / contacts.js can be loaded for their pure helpers */
var Log = { i: function () {}, w: function () {}, e: function () {} };
var Sound = {}; var Sip = { state: function () { return { state: 'idle' }; }, ua: function () { return null; } };
var Background = { bringToFront: function () {} };
</script>
<script src="../app/js/ptt.js"></script>
<script src="../app/js/route.js"></script>
<script src="../app/js/contacts.js"></script>
<script src="../app/js/messages.js"></script>
<script src="../app/js/call.js"></script>
<script src="../app/js/mwi.js"></script>
<script>
var pass = 0, fail = 0, results = document.getElementById('results');
function eq(name, actual, expected) {
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  if (ok) { pass++; } else { fail++; }
  var d = document.createElement('div');
  d.className = ok ? 'ok' : 'bad';
  d.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : '  expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  results.appendChild(d);
}

/* ---- Util.filterNumber ---- */
eq('filterNumber keeps digits * # +', Util.filterNumber('+40 (722) 12*3#4'), '+4072212*3#4');
eq('filterNumber strips letters/newlines', Util.filterNumber('a1\n2b;3'), '123');
eq('filterNumber null/undefined', [Util.filterNumber(null), Util.filterNumber(undefined)], ['', '']);
eq('filterNumber number input', Util.filterNumber(500), '500');

/* ---- Util.stepVolume ---- */
eq('volume up from 100%', Util.stepVolume(1, 1), 1.5);
eq('volume down from 100%', Util.stepVolume(1, -1), 0.8);
eq('volume clamps at max', Util.stepVolume(3, 1), 3);
eq('volume clamps at min', Util.stepVolume(0.2, -1), 0.2);
eq('volume snaps to nearest step', Util.stepVolume(0.95, 1), 1.5);
eq('volume full walk up', (function () { var v = 0.2, out = [v], i; for (i = 0; i < 10; i++) { v = Util.stepVolume(v, 1); out.push(v); } return out; }()), [0.2, 0.4, 0.6, 0.8, 1, 1.5, 2, 2.5, 3, 3, 3]);

/* ---- Util.fmtDuration ---- */
eq('fmtDuration 0', Util.fmtDuration(0), '00:00');
eq('fmtDuration 59', Util.fmtDuration(59), '00:59');
eq('fmtDuration 61', Util.fmtDuration(61), '01:01');
eq('fmtDuration 3725', Util.fmtDuration(3725), '62:05');
eq('fmtDuration negative/NaN', [Util.fmtDuration(-5), Util.fmtDuration(NaN)], ['00:00', '00:00']);
eq('mask', [Util.mask('abc'), Util.mask(''), Util.mask(null)], ['***', '', '']);

/* ---- Config.validate ---- */
eq('wssUrl ok', Config.validate('wssUrl', 'wss://pbx.example.com/ws'), '');
eq('wssUrl port ok', Config.validate('wssUrl', 'wss://host.example:8089/ws'), '');
eq('wssUrl ws:// rejected', Config.validate('wssUrl', 'ws://pbx.example.com/ws') !== '', true);
eq('wssUrl http rejected', Config.validate('wssUrl', 'https://x/ws') !== '', true);
eq('wssUrl injection rejected', Config.validate('wssUrl', 'wss://a.b/ws" onload="x') !== '', true);
eq('domain ok', Config.validate('domain', 'pbx.example.com'), '');
eq('domain space rejected', Config.validate('domain', 'pbx example') !== '', true);
eq('extension ok', Config.validate('extension', '206'), '');
eq('extension with @ ok', Config.validate('extension', 'a.b@c'), '');
eq('extension newline rejected', Config.validate('extension', '20\n6') !== '', true);
eq('password ok', Config.validate('password', 'x'), '');
eq('password empty rejected', Config.validate('password', '') !== '', true);
eq('password control char rejected', Config.validate('password', 'ab\u0007c') !== '', true);
eq('stun empty ok', Config.validate('stun', ''), '');
eq('stun ok', Config.validate('stun', 'stun:stun.l.google.com:19302'), '');
eq('stun bad', Config.validate('stun', 'http://x') !== '', true);
eq('background on/off', [Config.validate('background', 'on'), Config.validate('background', 'off'), Config.validate('background', 'x') !== ''], ['', '', true]);
eq('ringVolume bounds', [Config.validate('ringVolume', '0'), Config.validate('ringVolume', '100'), Config.validate('ringVolume', '101') !== '', Config.validate('ringVolume', '-1') !== ''], ['', '', true, true]);
eq('unknown key rejected', Config.validate('nope', 'x') !== '', true);

/* ---- Config get/set/isComplete (uses localStorage) ---- */
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();
eq('defaults: not complete', Config.isComplete(), false);
eq('defaults are generic (no server)', [Config.get().wssUrl, Config.get().domain], ['', '']);

/* ---- Config.normalizeServer ---- */
eq('server host only', Config.normalizeServer('pbx.example.com'), { wssUrl: 'wss://pbx.example.com/ws', domain: 'pbx.example.com' });
eq('server with spaces', Config.normalizeServer('  pbx.example.com  ').domain, 'pbx.example.com');
eq('server with port', Config.normalizeServer('pbx.example.com:8089'), { wssUrl: 'wss://pbx.example.com:8089/ws', domain: 'pbx.example.com' });
eq('server with own path', Config.normalizeServer('pbx.example.com/sip'), { wssUrl: 'wss://pbx.example.com/sip', domain: 'pbx.example.com' });
eq('server full wss url', Config.normalizeServer('wss://pbx.example.com/ws'), { wssUrl: 'wss://pbx.example.com/ws', domain: 'pbx.example.com' });
eq('server uppercase scheme', Config.normalizeServer('WSS://Pbx.Example.com').domain, 'Pbx.Example.com');
eq('server ws:// refused', Config.normalizeServer('ws://pbx.example.com').error, 'Folosește wss:// (securizat)');
eq('server https:// refused', Config.normalizeServer('https://pbx.example.com').error, 'Folosește wss:// (securizat)');
eq('server empty refused', Config.normalizeServer('   ').error, 'Completează serverul');
eq('server garbage refused', Config.normalizeServer('pbx example').error !== undefined, true);
eq('server injection refused', Config.normalizeServer('pbx.example.com/ws" onload="x').error !== undefined, true);
eq('set bad returns message', Config.set('extension', 'x y') !== '', true);
eq('set extension', Config.set('extension', '206'), '');
eq('still incomplete without password', Config.isComplete(), false);
eq('set password', Config.set('password', 'secret-pass'), '');
eq('still incomplete without a server', Config.isComplete(), false);
eq('set server + domain', [Config.set('wssUrl', 'wss://pbx.example.com/ws'), Config.set('domain', 'pbx.example.com')], ['', '']);
eq('complete now', Config.isComplete(), true);
eq('ringVolume stored as number', (Config.set('ringVolume', '40'), Config.get().ringVolume), 40);
Config._reset();
eq('persisted across reload', [Config.get().extension, Config.get().password, Config.get().ringVolume], ['206', 'secret-pass', 40]);
try { localStorage.setItem('kaisip.config', '{not json'); } catch (e) {}
Config._reset();
eq('corrupt storage falls back to defaults', Config.get().extension, '');
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();

/* ---- Errors ---- */
eq('sip 401', Errors.sip(401), 'Parolă greșită');
eq('sip 404/486', [Errors.sip(404), Errors.sip(486)], ['Număr inexistent', 'Ocupat']);
eq('sip 5xx generic', Errors.sip(599), 'Eroare server (599)');
eq('sip unknown 4xx generic', Errors.sip(418), 'Eroare (418)');
eq('sip zero/undefined', [Errors.sip(0), Errors.sip(undefined)], ['Eroare necunoscută', 'Eroare necunoscută']);
eq('registrationState', [Errors.registrationState(401), Errors.registrationState(403), Errors.registrationState(503), Errors.registrationState(undefined)], ['authfail', 'authfail', 'offline', 'offline']);
eq('text lookup + fallback', [Errors.text('registered'), Errors.text('zzz')], ['Înregistrat', 'zzz']);

/* ---- Errors.cause ---- */
eq('cause Busy/Rejected', [Errors.cause('Busy'), Errors.cause('Rejected')], ['Ocupat', 'Respins']);
eq('cause Not Found', Errors.cause('Not Found'), 'Număr inexistent');
eq('cause mic', Errors.cause('User Denied Media Access'), 'Microfon refuzat');
eq('cause unknown/empty', [Errors.cause('Whatever'), Errors.cause(undefined)], ['Apel eșuat', 'Apel încheiat']);

/* ---- Call._sipUri (domain from Config) ---- */
Config._reset(); try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config.set('domain', 'pbx.example.com');
eq('sipUri plain', Call._sipUri('207'), 'sip:207@pbx.example.com');
eq('sipUri star/hash/plus escaped', Call._sipUri('*72#+4'), 'sip:*72%23%2B4@pbx.example.com');
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();

/* ---- Call.dial pre-checks ---- */
Config.set('extension', '206');
eq('dial own number refused', Call.dial('206'), 'Acesta e numărul tău');
eq('dial empty refused', Call.dial(''), 'Număr invalid');
eq('dial letters only refused', Call.dial('abc'), 'Număr invalid');
eq('dial other number needs registration', Call.dial('207'), 'Nu ești înregistrat');
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();

/* ---- Config: new settings ---- */
eq('background valid', [Config.validate('background', 'on'), Config.validate('background', 'off')], ['', '']);
eq('background economic removed', Config.validate('background', 'low') !== '', true);
try { localStorage.setItem('kaisip.config', JSON.stringify({ background: 'low' })); } catch (e) {}
Config._reset();
eq('stored economic mode becomes continuous', Config.get().background, 'on');
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();
eq('background invalid', Config.validate('background', 'turbo') !== '', true);
eq('audioOut valid/invalid', [Config.validate('audioOut', 'ear'), Config.validate('audioOut', 'speaker'), Config.validate('audioOut', 'x') !== ''], ['', '', true]);
eq('audioOut default', Config.defaults.audioOut, 'ear');

/* ---- PTT settings ---- */
eq('normalizeList separators', Config.normalizeList('206; 207 ,208'), '206,207,208');
eq('normalizeList empty/garbage', [Config.normalizeList(''), Config.normalizeList(' , ;'), Config.normalizeList(null)], ['', '', '']);
eq('pttChannel validate', [Config.validate('pttChannel', ''), Config.validate('pttChannel', '700'), Config.validate('pttChannel', 'abc') !== '', Config.validate('pttChannel', '12345678901') !== ''], ['', '', true, true]);
eq('pttMembers validate', [Config.validate('pttMembers', ''), Config.validate('pttMembers', '206,207'), Config.validate('pttMembers', '206 207')], ['', '', '']);
eq('pttMembers too many', Config.validate('pttMembers', new Array(22).join('1,') + '1') !== '', true);
Config._reset(); try { localStorage.removeItem('kaisip.config'); } catch (e) {}
eq('pttMembers stored normalized', (Config.set('pttMembers', '206 / 207'), Config.get().pttMembers), '206,207');
eq('ptt defaults empty', [Config.defaults.pttChannel, Config.defaults.pttMembers], ['', '']);

/* ---- Ptt logic ---- */
Config._reset(); try { localStorage.removeItem('kaisip.config'); } catch (e) {}
eq('isMember false with empty list', [Ptt.isMember('206'), Ptt.isMember('')], [false, false]);
Config.set('pttMembers', '206,207');
eq('isMember with list', [Ptt.isMember('206'), Ptt.isMember('207'), Ptt.isMember('999'), Ptt.isMember('')], [true, true, false, false]);
eq('auto-answer needs header AND member', [Ptt.shouldAutoAnswer('1', '206'), Ptt.shouldAutoAnswer(null, '206'), Ptt.shouldAutoAnswer('1', '999'), Ptt.shouldAutoAnswer('', '206')], [true, false, false, false]);
eq('status idle without call', Ptt.status(null).key, 'idle');
eq('status ignores normal calls', Ptt.status({ ptt: false, dir: 'out', state: 'incall' }).key, 'idle');
eq('status out opening', [Ptt.status({ ptt: true, dir: 'out', state: 'calling' }).key, Ptt.status({ ptt: true, dir: 'out', state: 'ringing' }).key], ['opening', 'opening']);
eq('status out talking', Ptt.status({ ptt: true, dir: 'out', state: 'incall' }).text, 'VORBEȘTI');
eq('status in listening', Ptt.status({ ptt: true, dir: 'in', state: 'incall' }).key, 'listening');
eq('status ended -> idle', [Ptt.status({ ptt: true, dir: 'out', state: 'ended', message: 'Canal ocupat' }).text, Ptt.status({ ptt: true, dir: 'in', state: 'ended' }).key], ['Canal ocupat', 'idle']);
Config.set('pttChannel', '');
eq('press without channel', Ptt.press(), 'Setează canalul PTT în Setări');
Config.set('pttChannel', '700');
eq('press when not registered', Ptt.press(), 'Nu ești înregistrat');
eq('press leaves not talking', Ptt.isTalking(), false);
try { localStorage.removeItem('kaisip.config'); } catch (e) {}
Config._reset();

/* ---- chat settings ---- */
eq('msgSync validate', [Config.validate('msgSync', 'on'), Config.validate('msgSync', 'off'), Config.validate('msgSync', 'x') !== ''], ['', '', true]);
eq('msgBox validate', [Config.validate('msgBox', '*98'), Config.validate('msgBox', '699'), Config.validate('msgBox', 'abc') !== '', Config.validate('msgBox', '') !== ''], ['', '', true, true]);
eq('chat defaults', [Config.defaults.msgSync, Config.defaults.msgBox], ['on', '*98']);

/* ---- Messages ---- */
Messages.clear();
eq('cleanText controls/newline/null', [Messages.cleanText('a\u0007b\r\nc\td'), Messages.cleanText(null), Messages.cleanText(undefined)], ['ab\nc\td', '', '']);
eq('cleanText caps length', Messages.cleanText(new Array(700).join('x')).length, 500);
eq('empty store', [Messages.threads(), Messages.get('207'), Messages.unreadTotal()], [[], [], 0]);
eq('empty/blank refused', [Messages.addOutgoing('207', '   '), Messages.addIncoming('207', ''), Messages.addIncoming('207', '\n \t')], [null, null, null]);
var o1 = Messages.addOutgoing('207', 'salut', 'queued');
eq('outgoing stored', [o1.dir, o1.text, o1.status, Messages.get('207').length], ['out', 'salut', 'queued', 1]);
var i1 = Messages.addIncoming('207', 'hei', Date.now() + 10);
eq('incoming stored and unread', [i1.dir, Messages.unread('207'), Messages.unreadTotal()], ['in', 1, 1]);
eq('incoming duplicate within 3 s ignored', Messages.addIncoming('207', 'hei', Date.now() + 11), null);
eq('same text later is kept', !!Messages.addIncoming('207', 'hei', Date.now() + 20000), true);
eq('unread counts', Messages.unread('207'), 2);
Messages.markRead('207');
eq('markRead', [Messages.unread('207'), Messages.unreadTotal()], [0, 0]);
eq('queued list', Messages.queued().map(function (q) { return q.item.id === o1.id && q.number === '207'; }), [true]);
eq('setStatus sent', [Messages.setStatus('207', o1.id, 'sent'), Messages.get('207')[0].status, Messages.queued().length], [true, 'sent', 0]);
var o2 = Messages.addOutgoing('207', 'nu a plecat', 'sending');
Messages.setStatus('207', o2.id, 'failed');
eq('failed list', Messages.failed('207').map(function (x) { return x.text; }), ['nu a plecat']);
eq('setStatus unknown id/thread', [Messages.setStatus('207', 'nope', 'sent'), Messages.setStatus('999', 'x', 'sent')], [false, false]);
Messages.addIncoming('204', 'de la linphone', Date.now() + 99999);
eq('threads newest first', Messages.threads().map(function (t) { return t.number; }), ['204', '207']);
eq('label and preview', [Messages.label({ number: '204', unread: 2 }, 'Ana'), Messages.label({ number: '204', unread: 0 }), Messages.preview({ last: { dir: 'out', text: 'a  b' } })], ['Ana (2)', '204', 'Tu: a b']);
eq('preview truncates', Messages.preview({ last: { dir: 'in', text: new Array(60).join('z') } }).length, 34);
eq('removeThread', [Messages.removeThread('204'), Messages.threads().length], [true, 1]);
Messages.clear();
for (var q = 0; q < 105; q++) { Messages.addOutgoing('300', 'm' + q, 'sent'); }
eq('thread capped at 100, newest kept', [Messages.get('300').length, Messages.get('300')[99].text, Messages.get('300')[0].text], [100, 'm104', 'm5']);
Messages.clear();
for (var r = 0; r < 35; r++) { Messages.addOutgoing(String(500 + r), 'x', 'sent'); }
eq('threads capped at 30', Messages.threads().length, 30);
try { localStorage.setItem('kaisip.messages', 'garbage'); } catch (e) {}
eq('garbage storage -> empty', Messages.threads(), []);
try { localStorage.setItem('kaisip.messages', '{"threads":[1,2]}'); } catch (e) {}
eq('array threads -> empty', Messages.threads(), []);
Messages.clear();

/* ---- Route (desktop browser: no mozTelephony) ---- */
eq('route unsupported without mozTelephony', Route.supported(), false);
eq('route falls back to content channel', Route.channel(), 'content');
eq('route label empty when unsupported', Route.label(), '');
eq('route isSpeaker true when unsupported', Route.isSpeaker(), true);
eq('route setSpeaker refuses when unsupported', Route.setSpeaker(true), false);

/* ---- Contacts ---- */
Contacts.clear();
eq('contacts empty', Contacts.list(), []);
eq('validate empty name', Contacts.validate('  ', '207'), 'Scrie un nume');
eq('validate bad number', Contacts.validate('Ana', 'abc'), 'Număr invalid');
eq('validate long name', Contacts.validate(new Array(50).join('a'), '1') !== '', true);
var r1 = Contacts.add('  Zoe ', '207'); var r2 = Contacts.add('ana', '204'); var r3 = Contacts.add('Bogdan', '+40 722-123');
eq('add returns ids', [!!r1.id, !!r2.id, !!r3.id], [true, true, true]);
eq('sorted case-insensitive', Contacts.list().map(function (c) { return c.name; }), ['ana', 'Bogdan', 'Zoe']);
eq('number filtered when stored', Contacts.findByNumber('+40722123').name, 'Bogdan');
eq('name trimmed', Contacts.get(r1.id).name, 'Zoe');
eq('duplicate number refused', Contacts.add('Alt', '207').error, 'Există deja: Zoe');
eq('findByNumber with formatting', Contacts.findByNumber('20 7').name, 'Zoe');
eq('findByNumber missing', Contacts.findByNumber('999'), null);
eq('findByNumber empty', Contacts.findByNumber(''), null);
eq('update keeps own number', Contacts.update(r2.id, 'Ana M', '204').id, r2.id);
eq('update to other contact number refused', Contacts.update(r2.id, 'Ana M', '207').error, 'Există deja: Zoe');
eq('update missing id', Contacts.update('nope', 'X', '555').error, 'Contact negăsit');
eq('remove existing/missing', [Contacts.remove(r3.id), Contacts.remove(r3.id)], [true, false]);
eq('count after remove', Contacts.count(), 2);
try { localStorage.setItem('kaisip.contacts', '[{"id":1},{"id":"x","name":"N","number":"5"}]'); } catch (e) {}
eq('corrupt entries filtered', Contacts.list().length, 1);
try { localStorage.setItem('kaisip.contacts', 'garbage'); } catch (e) {}
eq('garbage storage -> empty', Contacts.list(), []);
Contacts.clear();
for (var j = 0; j < 205; j++) { Contacts.add('C' + j, String(1000 + j)); }
eq('contacts capped at 200', Contacts.count(), 200);
Contacts.clear();

/* ---- CallLog ---- */
try { localStorage.removeItem('kaisip.calllog'); } catch (e) {}
eq('calllog empty', CallLog.list(), []);
CallLog.add({ dir: 'out', number: '207', result: 'answered', duration: 75.9, ts: 1000 });
CallLog.add({ dir: 'in', number: '204', name: 'Linphone', result: 'missed', ts: 2000 });
var l2 = CallLog.list();
eq('calllog order newest first', [l2[0].number, l2[1].number], ['204', '207']);
eq('calllog duration floored', l2[1].duration, 75);
eq('calllog bad dir defaults to out', (CallLog.add({ dir: 'x', number: '1', ts: 3000 }), CallLog.list()[0].dir), 'out');
for (var i = 0; i < 30; i++) { CallLog.add({ dir: 'in', number: String(100 + i), result: 'answered', ts: 4000 + i }); }
eq('calllog capped at 20', CallLog.list().length, 20);
eq('calllog newest kept', CallLog.list()[0].number, '129');
try { localStorage.setItem('kaisip.calllog', 'not json'); } catch (e) {}
eq('calllog corrupt storage -> empty', CallLog.list(), []);
try { localStorage.setItem('kaisip.calllog', '{"a":1}'); } catch (e) {}
eq('calllog non-array storage -> empty', CallLog.list(), []);
eq('label missed incoming', CallLog.label({ dir: 'in', result: 'missed', number: '204', name: 'Linphone', ts: new Date(2026, 9, 9, 8, 5).getTime() }), '! Linphone  08:05');
eq('label outgoing', CallLog.label({ dir: 'out', result: 'answered', number: '207', name: '', ts: new Date(2026, 9, 9, 14, 30).getTime() }), '> 207  14:30');
CallLog.clear();
eq('calllog clear', CallLog.list(), []);


/* ---- dashboard helpers ---- */
eq('fmtClock pads', Util.fmtClock(new Date(2026, 9, 10, 8, 5)), '08:05');
eq('fmtDate', Util.fmtDate(new Date(2026, 9, 10)), 'sâm 10 oct');
try { localStorage.removeItem('kaisip.calllogseen'); } catch (e) {}
CallLog.clear();
CallLog.add({ dir: 'in', number: '204', result: 'missed', ts: 5000 });
CallLog.add({ dir: 'in', number: '205', result: 'answered', ts: 6000 });
CallLog.add({ dir: 'out', number: '206', result: 'missed', ts: 7000 });
eq('missedNew counts only unanswered incoming', CallLog.missedNew(), 1);
CallLog.markSeen();
eq('missedNew is 0 after markSeen', CallLog.missedNew(), 0);
CallLog.add({ dir: 'in', number: '207', result: 'missed', ts: Date.now() + 1000 });
eq('missedNew counts calls after markSeen', CallLog.missedNew(), 1);
CallLog.clear();
try { localStorage.removeItem('kaisip.calllogseen'); } catch (e) {}

/* ---- Mwi.parse ---- */
eq('mwi two new', Mwi.parse('Messages-Waiting: yes\r\nVoice-Message: 2/5 (0/0)\r\n'), { waiting: true, newMsgs: 2, oldMsgs: 5 });
eq('mwi none', Mwi.parse('Messages-Waiting: no\r\nVoice-Message: 0/3 (0/0)'), { waiting: false, newMsgs: 0, oldMsgs: 3 });
eq('mwi waiting without count', Mwi.parse('Messages-Waiting: yes'), { waiting: true, newMsgs: 1, oldMsgs: 0 });
eq('mwi count only', Mwi.parse('Voice-Message: 4/0'), { waiting: true, newMsgs: 4, oldMsgs: 0 });
eq('mwi garbage', Mwi.parse(null), { waiting: false, newMsgs: 0, oldMsgs: 0 });
eq('vmBox default and validation', [Config.defaults.vmBox, Config.validate('vmBox', '*97'), Config.validate('vmBox', 'ab') !== ''], ['*97', '', true]);

var s = document.getElementById('summary');
s.className = fail ? 'bad' : 'ok';
s.textContent = '--- ' + pass + ' passed, ' + fail + ' failed ---';
document.title = 'TESTS ' + pass + ' pass ' + fail + ' fail';
</script>
</body>
</html>
