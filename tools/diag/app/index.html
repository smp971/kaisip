<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KaiSIP Diag</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #101418; color: #e8eef2;
    font: 15px/1.3 sans-serif; overflow: hidden; }
  #top { position: absolute; top: 0; left: 0; right: 0; height: 24px; background: #1b232a; font-size: 12px;
    line-height: 24px; padding: 0 6px; white-space: nowrap; overflow: hidden; color: #9fb0bb; }
  #body { position: absolute; top: 24px; bottom: 30px; left: 0; right: 0; padding: 6px; overflow-y: auto; }
  #sk { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: #1b232a; font-weight: bold;
    line-height: 30px; }
  #sk span { position: absolute; top: 0; }
  #l { left: 6px; } #c { left: 0; right: 0; text-align: center; color: #2ecc71; } #r { right: 6px; }
  h1 { font-size: 16px; margin: 2px 0 8px; color: #9fb0bb; }
  .item { padding: 6px; border-bottom: 1px solid #222c34; }
  .item.sel { background: #2c3e50; }
  .big { font-size: 20px; text-align: center; margin: 14px 0 8px; }
  .hint { color: #9fb0bb; font-size: 13px; text-align: center; }
  .ok { color: #2ecc71; } .bad { color: #ff8a80; } .warn { color: #f1c40f; }
  .row { font-size: 13px; padding: 2px 0; border-bottom: 1px solid #222c34; }
</style>
</head>
<body>
<div id="top"></div>
<div id="body"></div>
<div id="sk"><span id="l"></span><span id="c"></span><span id="r"></span></div>
<script src="js/log.js"></script>
<script src="js/diag.js"></script>
</body>
</html>
